<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engraved Machines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IM+Fell+English:ital@0;1&family=Pixelify+Sans:wght@500;600&family=VT323&display=swap">
<style>
  /* A single paper look, on purpose: this is a print. Layout: a full-bleed relief print; caption top-left, tools top-right, a year rail along the foot. */
  :root {
    --paper: #efe5d4;
    --warm: #e3d4bc;
    --light: #f7f0e4;
    --ink: #16110d;
    --umber: #2b1f16;
    --earth: #5a4330;
    --graphite: #4f4840;
    --graphite2: #8a8072;
    --rule: #16110d33;
    --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-mono);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: ns-resize; }

  .cap {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    left: 28px;
    max-width: min(34rem, calc(100vw - 230px));
    pointer-events: none;
    display: grid;
    gap: 6px;
    will-change: opacity, transform;
  }
  .meta {
    margin: 0;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--earth);
    font-variant-numeric: tabular-nums;
  }
  .meta .sep { margin: 0 0.6em; }
  h1 {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(1.9rem, 4.2vw, 2.9rem);
    line-height: 1;
    text-wrap: balance;
  }
  .line {
    margin: 2px 0 0;
    font-family: var(--f-display);
    font-style: italic;
    font-size: 1.04rem;
    line-height: 1.35;
    color: var(--umber);
    max-width: 30rem;
  }
  .next {
    margin: 4px 0 0;
    font-size: 0.72rem;
    color: var(--earth);
  }
  .next b { font-weight: 600; color: var(--ink); }

  .tools {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    right: 24px;
    display: flex;
    gap: 6px;
  }
  .tools button {
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--paper);
    color: var(--ink);
    font: 500 0.95rem/1 var(--f-mono);
    cursor: pointer;
  }
  .tools button:hover { background: var(--ink); color: var(--paper); }
  .tools button:focus-visible, .rail button:focus-visible { outline: 2px solid var(--earth); outline-offset: 2px; }
  .tools button span { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .tools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* The buttons take on the interface of the machine on screen, era by era. */
  .tools button { transition: background 0.4s, color 0.4s, border-color 0.4s, border-radius 0.4s, box-shadow 0.4s; }
  /* Apple I and II: the monitor's phosphor */
  body[data-era="apple2"] .tools button { background: #14110e; color: #bfe3b0; border: 2px solid #3b3127; border-radius: 3px; font-family: "VT323", monospace; font-size: 1.25rem; }
  body[data-era="apple2"] .tools button span { font-size: 1.05rem; letter-spacing: 0.08em; }
  body[data-era="apple2"] .tools button:hover, body[data-era="apple2"] .tools button[aria-pressed="true"] { background: #bfe3b0; color: #14110e; }
  /* Macintosh, 1984: black on white, round-cornered, inverted when pressed */
  body[data-era="system1"] .tools button, body[data-era="system7"] .tools button { background: #fff; color: #000; border: 1px solid #000; border-radius: 8px; font-family: "Pixelify Sans", monospace; font-weight: 600; }
  body[data-era="system1"] .tools button span, body[data-era="system7"] .tools button span { text-transform: none; letter-spacing: 0.02em; font-size: 0.85rem; }
  body[data-era="system1"] .tools button:hover, body[data-era="system1"] .tools button[aria-pressed="true"],
  body[data-era="system7"] .tools button:hover, body[data-era="system7"] .tools button[aria-pressed="true"] { background: #000; color: #fff; }
  /* System 7 on the PowerBook: the same, with a hard shadow */
  body[data-era="system7"] .tools button { border-radius: 5px; box-shadow: 2px 2px 0 #000; }
  /* Mac OS 8 Platinum: grey bevels */
  body[data-era="platinum"] .tools button { background: #ddd; color: #000; border: 1px solid #5a5a5a; border-radius: 4px; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #9b9b9b; font: 700 0.8rem/1 Verdana, Geneva, sans-serif; }
  body[data-era="platinum"] .tools button span { text-transform: none; letter-spacing: 0; font-size: 0.78rem; }
  body[data-era="platinum"] .tools button:hover, body[data-era="platinum"] .tools button[aria-pressed="true"] { background: #a8a8b8; color: #000; box-shadow: inset 1px 1px 0 #6d6d7a, inset -1px -1px 0 #e6e6ee; }
  /* iPod: white plastic, and the grey-green LCD with its bitmap type when on */
  body[data-era="ipod"] .tools button { background: linear-gradient(#fdfdfb, #e4e4e0); color: #2a2a2a; border: 1px solid #b9b9b3; border-radius: 14px; font-family: "Pixelify Sans", monospace; font-weight: 600; }
  body[data-era="ipod"] .tools button span { text-transform: none; letter-spacing: 0.02em; font-size: 0.85rem; }
  body[data-era="ipod"] .tools button:hover, body[data-era="ipod"] .tools button[aria-pressed="true"] { background: #b4bba2; color: #1d2219; border-color: #7d846c; }
  /* iPhone, 2007: glossy blue navigation-bar buttons */
  body[data-era="iphone"] .tools button { background: linear-gradient(#9bb2d1, #7690bb 50%, #6582b2 51%, #5675aa); color: #fff; border: 1px solid #2f4b7a; border-radius: 6px; text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.45); font: 700 0.85rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body[data-era="iphone"] .tools button span { text-transform: none; letter-spacing: 0; font-size: 0.82rem; }
  body[data-era="iphone"] .tools button:hover, body[data-era="iphone"] .tools button[aria-pressed="true"] { background: linear-gradient(#6d86b0, #4c6aa0 50%, #3e5d95 51%, #34548c); }
  /* Mac OS X Leopard: Aqua pills, blue when on */
  body[data-era="aqua"] .tools button { background: linear-gradient(#fefefe, #ececec 50%, #dcdcdc 51%, #f0f0f0); color: #000; border: 1px solid #8a8a8a; border-radius: 999px; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.18); font: 400 0.82rem/1 "Lucida Grande", "Lucida Sans Unicode", sans-serif; padding: 0 14px; }
  body[data-era="aqua"] .tools button span { text-transform: none; letter-spacing: 0; font-size: 0.8rem; }
  body[data-era="aqua"] .tools button:hover, body[data-era="aqua"] .tools button[aria-pressed="true"] { background: linear-gradient(#d4e9ff, #89bdf5 50%, #5ea4ef 51%, #9fd0ff); border-color: #4a77b4; }
  /* watchOS: black capsules */
  body[data-era="watch"] .tools button { background: #1c1c1e; color: #fff; border: 1px solid #1c1c1e; border-radius: 999px; font: 600 0.82rem/1 system-ui, -apple-system, "Helvetica Neue", sans-serif; padding: 0 14px; }
  body[data-era="watch"] .tools button span { text-transform: none; letter-spacing: 0; font-size: 0.82rem; }
  body[data-era="watch"] .tools button:hover, body[data-era="watch"] .tools button[aria-pressed="true"] { background: #a6ff00; color: #000; border-color: #a6ff00; }
  /* macOS Big Sur and after: soft translucent controls, the system blue when on */
  body[data-era="bigsur"] .tools button { background: rgba(255, 255, 255, 0.72); color: #1d1d1f; border: 0.5px solid rgba(0, 0, 0, 0.16); border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font: 500 0.82rem/1 system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  body[data-era="bigsur"] .tools button span { text-transform: none; letter-spacing: 0; font-size: 0.82rem; }
  body[data-era="bigsur"] .tools button:hover { background: rgba(255, 255, 255, 0.95); }
  body[data-era="bigsur"] .tools button[aria-pressed="true"] { background: #007aff; color: #fff; border-color: #007aff; }
  body.notes-off .cap { opacity: 0 !important; visibility: hidden; }
  body.notes-off .hint { display: none; }

  .sound-line {
    position: fixed;
    left: 28px;
    right: 28px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    margin: 0;
    text-align: center;
    font-family: var(--f-display);
    font-size: 1.05rem;
    color: var(--umber);
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .sound-line.on { opacity: 1; transform: none; }
  /* the subtitle sits on its own patch of paper so it never runs over a drawing's notes */
  .sound-line q, .sound-line span { background: var(--paper); box-shadow: 0 0 0 6px var(--paper); }
  .sound-line span { display: table; margin-left: auto; margin-right: auto; }

  /* YouTube sources play in small players that stay visible while they are heard */
  .yt-dock {
    position: fixed;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    z-index: 5;
  }
  .yt-dock.off { display: none; }
  .yt-card { display: none; margin: 0; padding: 6px; background: var(--paper); border: 1px solid var(--ink); border-radius: 2px; }
  .yt-card.on { display: block; }
  .yt-card iframe { display: block; width: 200px; height: 200px; }
  .yt-card figcaption { width: 200px; margin-top: 4px; font: 400 0.6rem/1.3 var(--f-mono); color: var(--earth); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sound-line q { font-style: italic; }
  .sound-line span { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.06em; color: var(--earth); }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    margin: 0;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--earth);
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .hint.gone { opacity: 0; }

  .rail {
    position: fixed;
    left: 16px; right: 16px;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    border-top: 1px solid var(--rule);
    background: var(--paper);
  }
  .rail ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
  }
  .rail button {
    width: 100%;
    padding: 10px 2px 6px;
    background: none;
    border: 0;
    color: var(--earth);
    font: 400 0.68rem/1.25 var(--f-mono);
    cursor: pointer;
    display: grid;
    justify-items: center;
    gap: 2px;
    font-variant-numeric: tabular-nums;
  }
  .rail button .n {
    font-size: 0.6rem;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.8;
  }
  .rail button:hover, .rail button.on { color: var(--ink); }
  .rail button.on .y { font-weight: 600; }
  .track { position: absolute; top: -5px; left: calc(50% / 13); right: calc(50% / 13); height: 9px; pointer-events: none; }
  .cursor { position: absolute; top: 0; width: 2px; height: 9px; margin-left: -1px; background: var(--ink); }

  @media (max-width: 900px) { .rail button .n { display: none; } }
  @media (max-width: 640px) {
    .cap { left: 16px; right: 16px; max-width: none; top: calc(env(safe-area-inset-top, 0px) + 66px); }
    .tools { right: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px); flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 32px); }
    .tools button { min-width: 34px; height: 34px; padding: 0 8px; }
    .line { font-size: 0.95rem; }
    .rail { left: 8px; right: 8px; }
    .rail button { font-size: 0.56rem; padding-inline: 0; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="A relief print of a computer. Zoom in to travel into its screen and find the next machine."></canvas>

<header class="cap" id="cap" aria-live="polite">
  <p class="meta"><span id="m-year">1976</span><span class="sep">·</span><span id="m-idx">01</span> of <span id="m-total">13</span><span class="sep">·</span><span id="m-kind">Circuit board</span></p>
  <h1 id="title">Apple I</h1>
  <p class="line" id="line"></p>
  <p class="next"><span id="verb">Zoom into the silkscreen</span> to reach <b id="next">Apple II</b></p>
</header>

<div class="tools">
  <button type="button" id="b-out" aria-label="Zoom out to the previous machine">−</button>
  <button type="button" id="b-in" aria-label="Zoom in to the next machine">+</button>
  <button type="button" id="b-play" aria-pressed="false"><span>Play</span></button>
  <button type="button" id="b-notes" aria-pressed="true"><span>Notes</span></button>
  <button type="button" id="b-sound" aria-pressed="false"><span>Sound off</span></button>
</div>

<p class="hint" id="hint">Scroll down to travel into each machine, and up to come back out.</p>
<p class="sound-line" id="sound-line" aria-live="polite"><q></q><span></span></p>

<footer class="rail">
  <ol id="ticks"></ol>
  <div class="track"><div class="cursor" id="cursor"></div></div>
</footer>

<script src="js/ink.js?v=12"></script>
<script src="js/geo.js?v=12"></script>
<script src="js/kit.js?v=12"></script>
<script src="js/soundtrack.js?v=12"></script>
<script src="js/sound.js?v=12"></script>
<script src="js/machines/early.js?v=12"></script>
<script src="js/machines/mid.js?v=12"></script>
<script src="js/machines/late.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
