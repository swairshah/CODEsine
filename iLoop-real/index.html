<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Machines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Pixelify+Sans:wght@500;600&family=VT323&display=swap">
<style>
  /* A product-photography studio: each machine stands on a seamless paper sweep under softboxes.
     The page's type sits over the photograph; caption top-left, tools top-right, a year rail along the foot. */
  :root {
    --paper: #d9d7d2;
    --ink: #1d1d1f;
    --sub: #3a3a3c;
    --muted: #6e6e73;
    --rule: rgba(0, 0, 0, 0.12);
    --glass: rgba(246, 245, 242, 0.55);
    --f-display: "Inter Tight", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --f-text: "Inter", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #8a8985;
    color: var(--ink);
    font-family: var(--f-text);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: ns-resize; }

  .cap {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 24px);
    left: 30px;
    max-width: min(32rem, calc(100vw - 260px));
    pointer-events: none;
    display: grid;
    gap: 6px;
    will-change: opacity, transform;
  }
  .meta {
    margin: 0;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .meta .sep { margin: 0 0.6em; }
  h1 {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 600;
    font-size: clamp(1.9rem, 4vw, 2.75rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .line {
    margin: 2px 0 0;
    font-size: 0.98rem;
    line-height: 1.4;
    color: var(--sub);
    max-width: 30rem;
  }
  .next { margin: 4px 0 0; font-size: 0.74rem; color: var(--muted); }
  .next b { font-weight: 600; color: var(--ink); }

  .tools {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 24px);
    right: 26px;
    display: flex;
    gap: 6px;
  }
  .tools button {
    display: grid;
    place-items: center;
    min-width: 40px;
    height: 38px;
    padding: 0 9px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    border-radius: 10px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    backdrop-filter: blur(14px) saturate(1.3);
    color: var(--ink);
    font: 500 0.9rem/1 var(--f-text);
    cursor: pointer;
  }
  .tools button:hover { background: rgba(255, 255, 255, 0.85); }
  .tools button:focus-visible, .rail button:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
  .tools button[aria-pressed="true"] { background: var(--ink); color: #f5f5f7; }
  .tools button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tools button svg .fill { fill: currentColor; stroke: none; }
  #b-play .i-pause, #b-play[aria-pressed="true"] .i-play { display: none; }
  #b-play[aria-pressed="true"] .i-pause { display: block; }
  .tools button[aria-pressed="true"] .i-off { display: none; }

  /* The buttons take on the interface of the machine in the photograph, era by era. */
  .tools button { transition: background 0.4s, color 0.4s, border-color 0.4s, border-radius 0.4s, box-shadow 0.4s; }
  body[data-era="apple2"] .tools button { background: #14110e; color: #9fe39a; border: 2px solid #3b3127; border-radius: 3px; font-family: "VT323", monospace; font-size: 1.25rem; -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-era="apple2"] .tools button:hover, body[data-era="apple2"] .tools button[aria-pressed="true"] { background: #9fe39a; color: #14110e; }
  body[data-era="system1"] .tools button, body[data-era="system7"] .tools button { background: #fff; color: #000; border: 1px solid #000; border-radius: 8px; font-family: "Pixelify Sans", monospace; font-weight: 600; -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-era="system1"] .tools button:hover, body[data-era="system1"] .tools button[aria-pressed="true"],
  body[data-era="system7"] .tools button:hover, body[data-era="system7"] .tools button[aria-pressed="true"] { background: #000; color: #fff; }
  body[data-era="system7"] .tools button { border-radius: 5px; box-shadow: 2px 2px 0 #000; }
  body[data-era="platinum"] .tools button { background: #ddd; color: #000; border: 1px solid #5a5a5a; border-radius: 4px; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #9b9b9b; font: 700 0.8rem/1 Verdana, Geneva, sans-serif; -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-era="platinum"] .tools button:hover, body[data-era="platinum"] .tools button[aria-pressed="true"] { background: #a8a8b8; color: #000; box-shadow: inset 1px 1px 0 #6d6d7a, inset -1px -1px 0 #e6e6ee; }
  body[data-era="ipod"] .tools button { background: linear-gradient(#fdfdfb, #e4e4e0); color: #2a2a2a; border: 1px solid #b9b9b3; border-radius: 14px; font-family: "Pixelify Sans", monospace; font-weight: 600; }
  body[data-era="ipod"] .tools button:hover, body[data-era="ipod"] .tools button[aria-pressed="true"] { background: #b4bba2; color: #1d2219; border-color: #7d846c; }
  body[data-era="iphone"] .tools button { background: linear-gradient(#9bb2d1, #7690bb 50%, #6582b2 51%, #5675aa); color: #fff; border: 1px solid #2f4b7a; border-radius: 6px; text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.45); font: 700 0.85rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body[data-era="iphone"] .tools button:hover, body[data-era="iphone"] .tools button[aria-pressed="true"] { background: linear-gradient(#6d86b0, #4c6aa0 50%, #3e5d95 51%, #34548c); }
  body[data-era="aqua"] .tools button { background: linear-gradient(#fefefe, #ececec 50%, #dcdcdc 51%, #f0f0f0); color: #000; border: 1px solid #8a8a8a; border-radius: 999px; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.18); font: 400 0.82rem/1 "Lucida Grande", "Lucida Sans Unicode", sans-serif; padding: 0 14px; }
  body[data-era="aqua"] .tools button:hover, body[data-era="aqua"] .tools button[aria-pressed="true"] { background: linear-gradient(#d4e9ff, #89bdf5 50%, #5ea4ef 51%, #9fd0ff); border-color: #4a77b4; }
  body[data-era="watch"] .tools button { background: #1c1c1e; color: #fff; border: 1px solid #1c1c1e; border-radius: 999px; padding: 0 14px; }
  body[data-era="watch"] .tools button:hover, body[data-era="watch"] .tools button[aria-pressed="true"] { background: #a6ff00; color: #000; border-color: #a6ff00; }
  body[data-era="bigsur"] .tools button[aria-pressed="true"] { background: #007aff; color: #fff; border-color: #007aff; }
  body.notes-off .cap { opacity: 0 !important; visibility: hidden; }
  body.notes-off .hint { display: none; }


  .yt-dock { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); display: flex; gap: 8px; align-items: flex-end; z-index: 5; }
  .yt-dock.off { display: none; }
  .yt-card { display: none; margin: 0; padding: 6px; background: var(--glass); border: 1px solid var(--rule); border-radius: 10px; }
  .yt-card.on { display: block; }
  .yt-card iframe { display: block; width: 200px; height: 200px; border-radius: 6px; }
  .yt-card figcaption { width: 200px; margin-top: 4px; font: 400 0.6rem/1.3 var(--f-text); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
    margin: 0;
    text-align: center;
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--sub);
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .hint.gone { opacity: 0; }

  .rail {
    position: fixed;
    left: 16px; right: 16px;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    border-top: 1px solid var(--rule);
  }
  .rail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); }
  .rail button {
    width: 100%;
    padding: 10px 2px 6px;
    background: none;
    border: 0;
    color: var(--sub);
    font: 500 0.68rem/1.25 var(--f-text);
    cursor: pointer;
    display: grid;
    justify-items: center;
    gap: 2px;
    font-variant-numeric: tabular-nums;
  }
  .rail button .n { font-size: 0.6rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
  .rail button:hover, .rail button.on { color: var(--ink); }
  .rail button.on .y { font-weight: 700; }
  .track { position: absolute; top: -5px; left: calc(50% / 13); right: calc(50% / 13); height: 9px; pointer-events: none; }
  .cursor { position: absolute; top: 0; width: 2px; height: 9px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .perf { position: fixed; left: 8px; bottom: 64px; font: 500 11px/1 ui-monospace, Menlo, monospace; color: #fff; background: rgba(0, 0, 0, 0.55); padding: 4px 6px; border-radius: 4px; z-index: 9; }

  @media (max-width: 900px) { .rail button .n { display: none; } }
  @media (max-width: 640px) {
    .cap { left: 16px; right: 16px; max-width: none; top: calc(env(safe-area-inset-top, 0px) + 60px); }
    .tools { top: auto; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); justify-content: space-between; }
    .tools button { min-width: 44px; height: 44px; padding: 0 8px; }
    .line { font-size: 0.92rem; }
    /* on a phone the timeline runs along the top, and the buttons along the bottom, under the thumb */
    .rail { left: 8px; right: 8px; top: 0; bottom: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: 0; border-top: 0; border-bottom: 1px solid var(--rule); }
    .track { top: auto; bottom: -5px; }
    .hint, .yt-dock { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
    .rail button { font-size: 0.56rem; padding-inline: 0; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="A photograph of a computer in a studio. Zoom in to travel into its screen and find the next machine."></canvas>

<header class="cap" id="cap" aria-live="polite">
  <p class="meta"><span id="m-year">1976</span><span class="sep">·</span><span id="m-idx">01</span> of <span id="m-total">13</span><span class="sep">·</span><span id="m-kind">Circuit board</span></p>
  <h1 id="title">Apple I</h1>
  <p class="line" id="line"></p>
  <p class="next"><span id="verb">Zoom into the processor</span> to reach <b id="next">Apple II</b></p>
</header>

<div class="tools">
  <button type="button" id="b-home" aria-label="Home" title="Back to the iLoop front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h4.2v-5h2.6v5h4.2v-9"/></svg></button>
  <button type="button" id="b-out" aria-label="Previous machine" title="Previous machine (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
  <button type="button" id="b-in" aria-label="Next machine" title="Next machine (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button type="button" id="b-play" aria-pressed="false" aria-label="Play" title="Play the whole loop (P)"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg></button>
  <button type="button" id="b-notes" aria-pressed="true" aria-label="Notes" title="Show or hide the notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h9M5 18h6"/></svg></button>
  <button type="button" id="b-music" aria-pressed="false" aria-label="Music off" title="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M9 17.6a2.6 2.6 0 1 1-1.6-2.4V6.2l10-2v11.4a2.6 2.6 0 1 1-1.6-2.4V7.9l-6.8 1.4z"/><path class="i-off" d="M4 4l16 16"/></svg></button>
  <button type="button" id="b-bites" aria-pressed="false" aria-label="Voice clips off" title="Voice clips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v9.5h-8.5L7 18.5V15H5z"/><path d="M8.5 9h7M8.5 11.8h4.5"/><path class="i-off" d="M4 4l16 16"/></svg></button>
</div>

<p class="hint" id="hint">Scroll down to travel into each machine, and up to come back out.</p>

<footer class="rail">
  <ol id="ticks"></ol>
  <div class="track"><div class="cursor" id="cursor"></div></div>
</footer>
