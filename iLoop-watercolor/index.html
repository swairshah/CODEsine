<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watercolour Machines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* One sheet of cold-pressed watercolour paper. The machines are drawn in sepia pen and washed in
     transparent colour; the page around them is set like the caption of a painted plate. */
  :root {
    --paper: #f4efe3;
    --warm: #d6b384;
    --light: #fbf8f1;
    --ink: #2b2d36;
    --pen: #2a211b;
    --umber: #4a3526;
    --earth: #7c5d42;
    --graphite: #5b4535;
    --graphite2: #8e8a84;
    --tint: #7c9cb0;
    --rule: #2a211b2e;
    --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --f-hand: "Caveat", "Bradley Hand", cursive;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--pen);
    font-family: var(--f-display);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: ns-resize; }

  .cap {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: 30px;
    max-width: min(34rem, calc(100vw - 230px));
    pointer-events: none;
    display: grid;
    gap: 4px;
    will-change: opacity, transform;
  }
  .meta {
    margin: 0;
    font-size: 0.82rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: var(--earth);
    font-variant-numeric: oldstyle-nums;
  }
  .meta .sep { margin: 0 0.6em; }
  h1 {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(2.1rem, 4.6vw, 3.2rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .line {
    margin: 4px 0 0;
    font-family: var(--f-display);
    font-size: 1.12rem;
    line-height: 1.3;
    color: var(--umber);
    max-width: 30rem;
  }
  .next {
    margin: 4px 0 0;
    font-family: var(--f-hand);
    font-size: 1.22rem;
    line-height: 1.1;
    color: var(--earth);
  }
  .next b { font-weight: 600; color: var(--pen); }

  /* The tools are small painted swatches: a pen outline round a pale wash of the machine's colour. */
  .tools {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    right: 24px;
    display: flex;
    gap: 7px;
  }
  .tools button {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 40px;
    height: 38px;
    padding: 0 9px;
    border: 1.3px solid var(--pen);
    border-radius: 3px 5px 4px 6px / 6px 3px 5px 3px;
    background: transparent;
    color: var(--pen);
    cursor: pointer;
    transition: background-color 0.5s, color 0.4s;
  }
  .tools button::before {
    content: "";
    position: absolute;
    inset: 3px -2px -2px 3px;
    border-radius: 40% 30% 45% 35% / 35% 45% 30% 40%;
    background: var(--tint);
    opacity: 0;
    z-index: -1;
    transition: opacity 0.5s;
  }
  .tools button:hover::before { opacity: 0.32; }
  .tools button[aria-pressed="true"]::before { opacity: 0.55; }
  .tools button:focus-visible, .rail button:focus-visible { outline: 2px solid var(--earth); outline-offset: 2px; }
  .tools button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tools button svg .fill { fill: currentColor; stroke: none; }
  #b-play .i-pause, #b-play[aria-pressed="true"] .i-play { display: none; }
  #b-play[aria-pressed="true"] .i-pause { display: block; }
  .tools button[aria-pressed="true"] .i-off { display: none; }
  body.notes-off .cap { opacity: 0 !important; visibility: hidden; }
  body.notes-off .hint { display: none; }


  /* YouTube sources play in small players that stay visible while they are heard */
  .yt-dock {
    position: fixed;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    z-index: 5;
  }
  .yt-dock.off { display: none; }
  .yt-card { display: none; margin: 0; padding: 6px; background: var(--paper); border: 1px solid var(--ink); border-radius: 2px; }
  .yt-card.on { display: block; }
  .yt-card iframe { display: block; width: 200px; height: 200px; }
  .yt-card figcaption { width: 200px; margin-top: 4px; font: 400 0.6rem/1.3 var(--f-mono); color: var(--earth); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    margin: 0;
    text-align: center;
    font-family: var(--f-hand);
    font-size: 1.15rem;
    color: var(--earth);
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .hint.gone { opacity: 0; }

  .rail {
    position: fixed;
    left: 16px; right: 16px;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    border-top: 1px solid var(--rule);
    background: transparent;
  }
  .rail ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
  }
  .rail button {
    width: 100%;
    padding: 10px 2px 6px;
    background: none;
    border: 0;
    color: var(--earth);
    font: 500 0.92rem/1.1 var(--f-display);
    font-variant-numeric: oldstyle-nums;
    cursor: pointer;
    display: grid;
    justify-items: center;
    gap: 2px;
    font-variant-numeric: tabular-nums;
  }
  .rail button .n {
    font-family: var(--f-hand);
    font-size: 0.9rem;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.8;
  }
  .rail button:hover, .rail button.on { color: var(--ink); }
  .rail button.on .y { font-weight: 600; }
  .track { position: absolute; top: -5px; left: calc(50% / 13); right: calc(50% / 13); height: 9px; pointer-events: none; }
  .cursor { position: absolute; top: -2px; width: 12px; height: 12px; margin-left: -6px; border-radius: 48% 52% 45% 55%; background: var(--tint); opacity: 0.75; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tint) 60%, #2a211b); }

  @media (max-width: 900px) { .rail button .n { display: none; } }
  @media (max-width: 640px) {
    .cap { left: 16px; right: 16px; max-width: none; top: calc(env(safe-area-inset-top, 0px) + 60px); }
    .tools { top: auto; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); justify-content: space-between; }
    .tools button { min-width: 44px; height: 44px; padding: 0 8px; }
    .line { font-size: 0.95rem; }
    /* on a phone the timeline runs along the top, and the buttons along the bottom, under the thumb */
    .rail { left: 8px; right: 8px; top: 0; bottom: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: 0; border-top: 0; border-bottom: 1px solid var(--rule); }
    .track { top: auto; bottom: -5px; }
    .hint, .yt-dock { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
    .rail button { font-size: 0.56rem; padding-inline: 0; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="A watercolour and pen drawing of a computer. Zoom in to travel into its screen and find the next machine."></canvas>

<header class="cap" id="cap" aria-live="polite">
  <p class="meta"><span id="m-year">1976</span><span class="sep">·</span><span id="m-idx">01</span> of <span id="m-total">13</span><span class="sep">·</span><span id="m-kind">Circuit board</span></p>
  <h1 id="title">Apple I</h1>
  <p class="line" id="line"></p>
  <p class="next"><span id="verb">Zoom into the silkscreen</span> to reach <b id="next">Apple II</b></p>
</header>

<div class="tools">
  <button type="button" id="b-home" aria-label="Home" title="Back to the iLoop front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h4.2v-5h2.6v5h4.2v-9"/></svg></button>
  <button type="button" id="b-out" aria-label="Previous machine" title="Previous machine (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
  <button type="button" id="b-in" aria-label="Next machine" title="Next machine (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button type="button" id="b-play" aria-pressed="false" aria-label="Play" title="Play the whole loop (P)"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg></button>
  <button type="button" id="b-notes" aria-pressed="true" aria-label="Notes" title="Show or hide the notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h9M5 18h6"/></svg></button>
  <button type="button" id="b-music" aria-pressed="false" aria-label="Music off" title="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M9 17.6a2.6 2.6 0 1 1-1.6-2.4V6.2l10-2v11.4a2.6 2.6 0 1 1-1.6-2.4V7.9l-6.8 1.4z"/><path class="i-off" d="M4 4l16 16"/></svg></button>
  <button type="button" id="b-bites" aria-pressed="false" aria-label="Voice clips off" title="Voice clips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v9.5h-8.5L7 18.5V15H5z"/><path d="M8.5 9h7M8.5 11.8h4.5"/><path class="i-off" d="M4 4l16 16"/></svg></button>
</div>

<p class="hint" id="hint">Scroll down to travel into each machine, and up to come back out.</p>

<footer class="rail">
  <ol id="ticks"></ol>
  <div class="track"><div class="cursor" id="cursor"></div></div>
</footer>

<script src="js/ink.js?v=20261014b"></script>
<script src="js/paper.js?v=20261014b"></script>

<script src="js/sound.js?v=20261014b"></script>
<script src="js/machines/early.js?v=20261014b"></script>
<script src="js/machines/mid.js?v=20261014b"></script>
<script src="js/machines/late.js?v=20261014b"></script>
<script src="js/app.js?v=20261014b"></script>
</body>
</html>
